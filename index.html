<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>빅데이터가시화</title>
<style>
:root{
  --navy:#24306B; --brand:#3C56C8; --brand-d:#2A3E9E; --yellow:#FFD43B;
  --ink:#151b2e; --mut:#5b6478; --line:#e2e6f0; --bg:#eef0f7;
  --card-a:#EEF1FB; --err:#c0392b; --errbg:#FCEAE7;
  --ok:#2f8a52; --okbg:#E7F5EC;
  --sans:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"D2Coding","Consolas","Menlo",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.7;
  display:flex;align-items:center;justify-content:center;padding:28px}
.wrap{width:100%;max-width:460px}

.card{background:#fff;border-radius:18px;box-shadow:0 14px 44px rgba(24,32,72,.13);
  overflow:hidden}
.card .head{background:var(--navy);color:#fff;padding:34px 32px 30px;text-align:center}
.head .eyebrow{font-size:11.5px;letter-spacing:.16em;color:var(--yellow);
  font-weight:700;margin:0 0 9px}
.head h1{margin:0;font-size:29px;font-weight:800;letter-spacing:-.01em}
.body{padding:28px 32px 26px}

.big{display:block;width:100%;border:0;border-radius:11px;background:var(--brand);
  color:#fff;font-family:inherit;font-size:16px;font-weight:700;padding:15px 18px;
  cursor:pointer;transition:.16s}
.big:hover{background:var(--brand-d)}
.big:disabled{background:#a8b1cc;cursor:progress}

label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:0 0 6px}
input[type=password],input[type=text]{width:100%;border:1.5px solid var(--line);
  border-radius:9px;padding:11px 13px;font-family:inherit;font-size:14.5px;
  outline:0;background:#fdfdff;color:var(--ink)}
input:focus{border-color:var(--brand);background:#fff}
.field{margin:0 0 14px}
.field .hint{font-size:11.5px;color:#8a90a3;margin:5px 0 0}

.row{display:flex;gap:8px}
.row .big{flex:1}
.ghost{border:1.5px solid var(--line);background:#fff;color:var(--mut);
  border-radius:11px;font-family:inherit;font-size:14px;font-weight:700;
  padding:13px 16px;cursor:pointer}
.ghost:hover{border-color:#c3cbdd;color:var(--ink)}

.msg{border-radius:9px;padding:11px 14px;font-size:13.5px;margin:0 0 14px}
.msg.bad{background:var(--errbg);color:var(--err)}
.msg.good{background:var(--okbg);color:var(--ok)}
.msg.info{background:var(--card-a);color:var(--brand-d)}

.foot{padding:0 32px 24px;display:flex;align-items:center;gap:10px}
.foot .link{font-size:12px;color:#9aa2b8;cursor:pointer;text-decoration:none}
.foot .link:hover{color:var(--brand)}
.foot .sp{flex:1}

h2.t{margin:0 0 4px;font-size:18px}
p.d{margin:0 0 18px;font-size:13.5px;color:var(--mut)}
.hidden{display:none !important}
hr.sep{border:0;border-top:1px solid var(--line);margin:20px 0 18px}
.note{background:#FFF6D9;border-left:4px solid #b8860b;border-radius:8px;
  padding:11px 14px;font-size:12.5px;color:#6b5200;margin:0 0 16px}
.note b{display:block;margin-bottom:3px}
code{font-family:var(--mono);background:var(--card-a);color:var(--brand-d);
  padding:1px 5px;border-radius:4px;font-size:.9em}
</style></head><body>

<div class="wrap"><div class="card">

  <div class="head">
    <p class="eyebrow">BIG DATA VISUALIZATION</p>
    <h1>빅데이터가시화</h1>
  </div>

  <!-- ── 첫 화면 ── -->
  <div class="body" id="v-home">
    <button class="big" id="btn-go">강의자료 사이트로 이동</button>
  </div>

  <!-- ── 비밀번호 입력 ── -->
  <div class="body hidden" id="v-ask">
    <h2 class="t">비밀번호 입력</h2>
    <p class="d">강의자료 사이트에 들어가려면 비밀번호가 필요합니다.</p>
    <div id="ask-msg"></div>
    <div class="field">
      <label for="ask-pw">비밀번호</label>
      <input type="password" id="ask-pw" autocomplete="off">
    </div>
    <div class="row">
      <button class="big" id="ask-ok">확인</button>
      <button class="ghost" data-back="">취소</button>
    </div>
  </div>

  <!-- ── 관리자 로그인 ── -->
  <div class="body hidden" id="v-admin">
    <h2 class="t">관리자 모드</h2>
    <p class="d">관리자 비밀번호를 입력하세요.</p>
    <div id="adm-msg"></div>
    <div class="field">
      <label for="adm-pw">관리자 비밀번호</label>
      <input type="password" id="adm-pw" autocomplete="off">
    </div>
    <div class="row">
      <button class="big" id="adm-ok">확인</button>
      <button class="ghost" data-back="">취소</button>
    </div>
  </div>

  <!-- ── 최초 설정 / 설정 변경 ── -->
  <div class="body hidden" id="v-setup">
    <h2 class="t" id="setup-title">최초 설정</h2>
    <p class="d" id="setup-desc">강의자료 사이트 주소와 비밀번호를 정합니다.</p>
    <div id="set-msg"></div>

    <div class="field">
      <label for="set-url">강의자료 사이트 주소</label>
      <input type="text" id="set-url" placeholder="https://..." autocomplete="off">
      <p class="hint">같은 폴더의 파일이면 파일 이름만 적어도 됩니다.</p>
    </div>

    <hr class="sep">

    <div class="field">
      <label for="set-pw">학생용 비밀번호</label>
      <input type="password" id="set-pw" autocomplete="new-password">
      <p class="hint" id="set-pw-hint">학생에게 알려 줄 비밀번호입니다.</p>
    </div>
    <div class="field">
      <label for="set-pw2">학생용 비밀번호 확인</label>
      <input type="password" id="set-pw2" autocomplete="new-password">
    </div>

    <hr class="sep">

    <div class="field">
      <label for="set-adm">관리자 비밀번호</label>
      <input type="password" id="set-adm" autocomplete="new-password">
      <p class="hint" id="set-adm-hint">이 화면에 다시 들어올 때 쓰는 비밀번호입니다.</p>
    </div>
    <div class="field">
      <label for="set-adm2">관리자 비밀번호 확인</label>
      <input type="password" id="set-adm2" autocomplete="new-password">
    </div>

    <div class="note"><b>저장 방법</b>
      아래 버튼을 누르면 설정이 들어간 새 HTML 파일이 내려받아집니다.
      그 파일로 지금 파일을 덮어써야 설정이 적용됩니다.</div>

    <div class="row">
      <button class="big" id="set-save">설정 저장 (파일 내려받기)</button>
      <button class="ghost" data-back="">취소</button>
    </div>
  </div>

  <div class="foot">
    <span class="sp"></span>
    <a class="link" id="to-admin">관리자</a>
  </div>

</div></div>

<script>
/* ────────────────────────────────────────────────────────────────
   설정값. 관리자 모드에서 저장하면 이 줄이 통째로 바뀝니다.
   비밀번호는 원문이 아니라 여러 번 해시한 값으로만 들어 있고,
   사이트 주소는 비밀번호로 암호화되어 있어 그대로는 읽히지 않습니다.
   ──────────────────────────────────────────────────────────────── */
var CONFIG = {"v":1,"ready":true,"salt":"a741438e63a84ac9ff97b4f9811bc12c","s":{"chk":"6c821e23e335b3c51b03cc6d492be429557ef64c4d2257c8712a6fc48cd29d21","url":"LVX7q0bmEd02kxkOpEEZQsA="},"a":{"chk":"35bd69cd7a22fa690ad6700fb96509f168e3a089473b04e521c208b8d0ac47a8","url":"siHc/kbzJMTpp65PoYX/0jc="}}; /*CONFIG_END*/

var ROUNDS = 60000;                       /* 비밀번호를 늘여 만드는 반복 횟수 */
var SRC = document.documentElement.outerHTML;   /* 저장할 때 쓸 원본 */

/* ── SHA-256 (외부 라이브러리 없이 동작하도록 직접 구현) ── */
function sha256(msg){
  function R(n,x){return (x>>>n)|(x<<(32-n))}
  var K=[],H=[];(function(){var i=0,n=2;
    function P(x){for(var f=2;f*f<=x;f++)if(x%f===0)return false;return true}
    while(i<64){if(P(n)){var c=Math.pow(n,1/3);K[i]=((c-Math.floor(c))*4294967296)|0;
      if(i<8){var s=Math.pow(n,1/2);H[i]=((s-Math.floor(s))*4294967296)|0}i++}n++}})();
  var b=typeof msg==='string'?(function(s){var u=unescape(encodeURIComponent(s)),a=[];
    for(var i=0;i<u.length;i++)a.push(u.charCodeAt(i));return a})(msg):msg.slice();
  var L=b.length*8;b.push(0x80);while((b.length%64)!==56)b.push(0);
  for(var i=7;i>=0;i--)b.push((i<4?Math.floor(L/Math.pow(2,i*8)):0)&255);
  var h=H.slice();
  for(var o=0;o<b.length;o+=64){var w=[];
    for(var i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
    for(i=16;i<64;i++){var s0=R(7,w[i-15])^R(18,w[i-15])^(w[i-15]>>>3),
      s1=R(17,w[i-2])^R(19,w[i-2])^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
    var a=h[0],c=h[1],d=h[2],e=h[3],f=h[4],g=h[5],p=h[6],q=h[7];
    for(i=0;i<64;i++){var S1=R(6,f)^R(11,f)^R(25,f),ch=(f&g)^(~f&p),
      t1=(q+S1+ch+K[i]+w[i])|0,S0=R(2,a)^R(13,a)^R(22,a),
      mj=(a&c)^(a&d)^(c&d),t2=(S0+mj)|0;
      q=p;p=g;g=f;f=(e+t1)|0;e=d;d=c;c=a;a=(t1+t2)|0}
    h[0]=(h[0]+a)|0;h[1]=(h[1]+c)|0;h[2]=(h[2]+d)|0;h[3]=(h[3]+e)|0;
    h[4]=(h[4]+f)|0;h[5]=(h[5]+g)|0;h[6]=(h[6]+p)|0;h[7]=(h[7]+q)|0}
  var out=[];for(i=0;i<8;i++)for(var j=3;j>=0;j--)out.push((h[i]>>>(j*8))&255);
  return out;
}
function bytes(s){var u=unescape(encodeURIComponent(s)),a=[];
  for(var i=0;i<u.length;i++)a.push(u.charCodeAt(i));return a}
function text(a){var s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);
  try{return decodeURIComponent(escape(s))}catch(e){return ''}}
function hex(a){var s='';for(var i=0;i<a.length;i++)s+=('0'+a[i].toString(16)).slice(-2);return s}
function b64(a){var s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function unb64(s){var t=atob(s),a=[];for(var i=0;i<t.length;i++)a.push(t.charCodeAt(i));return a}
function rand(n){var a=new Uint8Array(n);
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);
  else for(var i=0;i<n;i++)a[i]=Math.floor(Math.random()*256);
  return Array.prototype.slice.call(a)}

/* 비밀번호 → 키 (반복 해시로 대입 공격을 느리게 만든다) */
function stretch(pw, salt){
  var k = sha256(bytes(salt + '|' + pw));
  for (var i = 0; i < ROUNDS; i++) k = sha256(k);
  return k;
}
/* 키로 주소를 가리고 되살리는 함수 */
function mask(key, data){
  var out = [], blk = [], n = 0;
  for (var i = 0; i < data.length; i++){
    if (i % 32 === 0){ blk = sha256(key.concat(bytes('#' + n))); n++; }
    out.push(data[i] ^ blk[i % 32]);
  }
  return out;
}
function lock(pw, salt, url){
  var k = stretch(pw, salt);
  return { chk: hex(sha256(k.concat(bytes('check')))), url: b64(mask(k, bytes(url))) };
}
function unlock(pw, salt, box){
  var k = stretch(pw, salt);
  if (hex(sha256(k.concat(bytes('check')))) !== box.chk) return null;
  return text(mask(k, unb64(box.url)));
}

/* ── 화면 전환 ── */
var VIEWS = ['v-home','v-ask','v-admin','v-setup'];
function show(id){
  VIEWS.forEach(function(v){ document.getElementById(v).classList.toggle('hidden', v !== id) });
  var f = document.querySelector('#' + id + ' input');
  if (f) setTimeout(function(){ f.focus() }, 30);
}
function say(where, kind, txt){
  document.getElementById(where).innerHTML =
    txt ? '<div class="msg ' + kind + '">' + txt + '</div>' : '';
}
function clearPw(){
  ['ask-pw','adm-pw','set-pw','set-pw2','set-adm','set-adm2'].forEach(function(i){
    document.getElementById(i).value = '';
  });
}
document.querySelectorAll('[data-back]').forEach(function(b){
  b.onclick = function(){ clearPw(); say('ask-msg','',''); say('adm-msg','',''); say('set-msg','',''); show('v-home') };
});

/* 무거운 계산 전에 화면이 먼저 그려지도록 한 박자 쉰다 */
function busy(btn, label, work){
  var old = btn.textContent;
  btn.disabled = true; btn.textContent = label;
  setTimeout(function(){
    try { work() } finally { btn.disabled = false; btn.textContent = old }
  }, 30);
}

/* ── 학생: 사이트로 이동 ── */
document.getElementById('btn-go').onclick = function(){
  if (!CONFIG.ready){
    show('v-setup');
    say('set-msg','info','아직 설정이 되어 있지 않습니다. 아래 항목을 채워 주세요.');
    return;
  }
  say('ask-msg','',''); show('v-ask');
};
function tryEnter(){
  var pw = document.getElementById('ask-pw').value;
  if (!pw){ say('ask-msg','bad','비밀번호를 입력하세요.'); return }
  busy(document.getElementById('ask-ok'), '확인 중…', function(){
    var url = unlock(pw, CONFIG.salt, CONFIG.s);
    if (url === null){
      say('ask-msg','bad','비밀번호가 맞지 않습니다.');
      document.getElementById('ask-pw').select();
      return;
    }
    say('ask-msg','good','확인되었습니다. 이동합니다…');
    setTimeout(function(){ location.href = url }, 400);
  });
}
document.getElementById('ask-ok').onclick = tryEnter;
document.getElementById('ask-pw').addEventListener('keydown', function(e){
  if (e.key === 'Enter') tryEnter();
});

/* ── 관리자 ── */
document.getElementById('to-admin').onclick = function(){
  if (!CONFIG.ready){
    show('v-setup');
    say('set-msg','info','아직 설정이 되어 있지 않습니다. 아래 항목을 채워 주세요.');
    return;
  }
  say('adm-msg','',''); show('v-admin');
};
function tryAdmin(){
  var pw = document.getElementById('adm-pw').value;
  if (!pw){ say('adm-msg','bad','관리자 비밀번호를 입력하세요.'); return }
  busy(document.getElementById('adm-ok'), '확인 중…', function(){
    var url = unlock(pw, CONFIG.salt, CONFIG.a);
    if (url === null){
      say('adm-msg','bad','관리자 비밀번호가 맞지 않습니다.');
      document.getElementById('adm-pw').select();
      return;
    }
    document.getElementById('setup-title').textContent = '설정 변경';
    document.getElementById('setup-desc').textContent =
      '주소와 비밀번호를 바꿀 수 있습니다. 바꾸지 않을 비밀번호 칸은 비워 두세요.';
    document.getElementById('set-pw-hint').textContent =
      '비워 두면 기존 학생용 비밀번호를 그대로 씁니다.';
    document.getElementById('set-adm-hint').textContent =
      '비워 두면 기존 관리자 비밀번호를 그대로 씁니다.';
    document.getElementById('set-url').value = url;
    KEEP = { admPw: pw, url: url };
    say('set-msg','',''); clearPw(); show('v-setup');
  });
}
document.getElementById('adm-ok').onclick = tryAdmin;
document.getElementById('adm-pw').addEventListener('keydown', function(e){
  if (e.key === 'Enter') tryAdmin();
});

/* ── 설정 저장 ── */
var KEEP = null;                       /* 설정 변경으로 들어온 경우의 현재 값 */
document.getElementById('set-save').onclick = function(){
  var url  = document.getElementById('set-url').value.trim();
  var pw   = document.getElementById('set-pw').value;
  var pw2  = document.getElementById('set-pw2').value;
  var adm  = document.getElementById('set-adm').value;
  var adm2 = document.getElementById('set-adm2').value;
  var first = !CONFIG.ready;

  if (!url){ say('set-msg','bad','강의자료 사이트 주소를 입력하세요.'); return }
  if (first && (!pw || !adm)){
    say('set-msg','bad','학생용 비밀번호와 관리자 비밀번호를 모두 정해 주세요.'); return;
  }
  if (pw !== pw2){ say('set-msg','bad','학생용 비밀번호 두 칸이 서로 다릅니다.'); return }
  if (adm !== adm2){ say('set-msg','bad','관리자 비밀번호 두 칸이 서로 다릅니다.'); return }
  if (pw && pw.length < 4){ say('set-msg','bad','학생용 비밀번호는 4자 이상으로 정해 주세요.'); return }
  if (adm && adm.length < 6){ say('set-msg','bad','관리자 비밀번호는 6자 이상으로 정해 주세요.'); return }
  if (!first && !pw && !adm && url === KEEP.url){
    say('set-msg','bad','바뀐 내용이 없습니다.'); return;
  }

  busy(document.getElementById('set-save'), '만드는 중…', function(){
    var salt = hex(rand(16));
    var admPw = adm || (KEEP && KEEP.admPw);
    var cfg = { v:1, ready:true, salt:salt, s:null, a:null };

    if (!pw && !first){
      /* 학생용 비밀번호를 그대로 두려면 소금값도 그대로여야 한다 */
      cfg.salt = CONFIG.salt;
      cfg.s = { chk: CONFIG.s.chk, url: '' };
      say('set-msg','info','학생용 비밀번호를 그대로 두려면 새 주소를 학생 비밀번호로 다시 잠가야 합니다.');
      var ask = window.prompt('현재 학생용 비밀번호를 한 번만 입력해 주세요.\n(새 주소를 다시 잠그는 데 필요합니다)');
      if (ask === null){ say('set-msg','bad','저장을 취소했습니다.'); return }
      if (unlock(ask, CONFIG.salt, CONFIG.s) === null){
        say('set-msg','bad','현재 학생용 비밀번호가 맞지 않습니다.'); return;
      }
      cfg.s = lock(ask, cfg.salt, url);
    } else {
      cfg.s = lock(pw, cfg.salt, url);
    }
    cfg.a = lock(admPw, cfg.salt, url);

    var line = 'var CONFIG = ' + JSON.stringify(cfg) + '; /*CONFIG_END*/';
    var out = SRC.replace(/var CONFIG = \{[\s\S]*?\}; \/\*CONFIG_END\*\//, line);
    if (out === SRC){ say('set-msg','bad','설정 자리를 찾지 못했습니다. 파일이 손상되었을 수 있습니다.'); return }
    out = '<!doctype html>\n' + out;

    var blob = new Blob([out], { type: 'text/html;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '빅데이터가시화.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href) }, 2000);

    say('set-msg','good',
      '새 파일을 내려받았습니다. 이 파일로 지금 파일을 덮어쓰면 설정이 적용됩니다.');
    clearPw();
  });
};

/* 설정이 안 된 상태면 첫 화면에서 바로 알려 준다 */
if (!CONFIG.ready){
  document.getElementById('btn-go').textContent = '강의자료 사이트로 이동 (설정 필요)';
}
