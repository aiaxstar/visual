<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의자료</title>
<style>
  :root{
    --navy:#1b2a4a;
    --blue:#2f6fd0;
    --blue-soft:#eaf1fb;
    --yellow:#f5c518;
    --ink:#20262e;
    --muted:#6b7684;
    --line:#e3e8ef;
    --bg:#f6f8fb;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Pretendard","Malgun Gothic","맑은 고딕",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.6;
  }
  header{
    background:linear-gradient(135deg,var(--navy) 0%,#2a3f6b 100%);
    color:#fff;
    padding:48px 24px 40px;
    text-align:center;
    border-bottom:5px solid var(--yellow);
  }
  header h1{
    margin:0;
    font-size:38px;
    font-weight:800;
    letter-spacing:-0.5px;
  }
  header p{
    margin:10px 0 0;
    color:#c8d4e8;
    font-size:15px;
  }
  main{
    max-width:1080px;
    margin:0 auto;
    padding:40px 24px 64px;
  }
  .section-label{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:17px;
    font-weight:700;
    color:var(--navy);
    margin:0 0 20px;
  }
  .section-label::before{
    content:"";
    width:5px;
    height:20px;
    background:var(--yellow);
    border-radius:3px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:16px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 20px;
    text-decoration:none;
    color:inherit;
    display:block;
    transition:all .18s ease;
  }
  .card:hover{
    border-color:var(--blue);
    box-shadow:0 6px 18px rgba(47,111,208,.15);
    transform:translateY(-2px);
  }
  .card .no{
    display:inline-block;
    min-width:26px;
    height:26px;
    line-height:26px;
    text-align:center;
    background:var(--blue-soft);
    color:var(--blue);
    font-size:13px;
    font-weight:700;
    border-radius:6px;
    margin-bottom:10px;
  }
  .card .name{
    font-size:19px;
    font-weight:700;
    color:var(--navy);
    margin:0;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:0 24px 40px;
  }
</style>
</head>
<body>

<header>
  <h1>강의자료</h1>
  <p>과목명을 클릭하면 해당 강의자료 페이지로 이동합니다</p>
</header>

<main>
  <h2 class="section-label">과목 목록</h2>

  <div class="grid">

  <!-- ============================================================

       각 카드의 href="..." 안의 주소를 원하는 페이지 주소로 바꾸세요.
       ============================================================ -->

    <!-- 1. 웹프로그래밍 -->
    <a class="card" href="웹프로그래밍.html">

    </a>

    <!-- 5. 컴퓨터비전응용 -->
    <a class="card" href="컴퓨터비전응용.html">
      <span class="no">05</span>

    <!-- 6. 선형대수 -->

    <!-- 7. 대학SWAI기초 -->

    </a>

    <!-- 8. 경영경제AI활용 -->

      <span class="no">08</span>

    </a>

    <!-- 9. 알고리즘 -->

      <span class="no">09</span>

    </a>

    <!-- 10. 빅데이터가시화 -->

    </a>

    <!-- 11. 소프트웨어공학 -->
    <a class="card" href="소프트웨어공학.html">
      <span class="no">11</span>

    </a>

    <!-- 12. 파이썬프로그래밍 -->
    <a class="card" href="파이썬프로그래밍.html">
      <span class="no">12</span>
      <p class="name">파이썬프로그래밍</p>
    </a>

  </div>

</main>

<footer>© 강의자료 · 최종 수정일 2026-09-04</footer>

</body>
</html>
