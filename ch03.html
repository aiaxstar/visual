<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>데이터 시각화</title>
<style>
:root{
  --brand:#3C56C8; --brand-d:#2A3E9E; --ink:#151b2e; --mut:#5b6478;
  --line:#e2e6f0; --bg:#f6f7fb; --err:#c0392b; --dot:#FFD43B;
  --sans:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--sans);color:var(--ink);
  background:linear-gradient(135deg,#2A3E9E 0%,#3C56C8 55%,#5b71d6 100%);
  display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:400px;background:#fff;border-radius:16px;
  box-shadow:0 18px 50px rgba(15,23,60,.30);padding:34px 30px 28px;text-align:center}
.lockicon{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;
  background:#EEF1FB;display:flex;align-items:center;justify-content:center}
.lockicon svg{width:26px;height:26px;stroke:var(--brand);fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
h1{font-size:19px;margin:0 0 6px;font-weight:700;letter-spacing:-.2px}
.sub{font-size:13px;color:var(--mut);margin:0 0 22px;line-height:1.6}
.field{position:relative;margin-bottom:12px}
input[type=password],input[type=text]{width:100%;font-family:inherit;font-size:15px;
  padding:13px 44px 13px 14px;border:1.5px solid var(--line);border-radius:9px;
  background:#fbfcff;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(60,86,200,.14)}
body.shake .field{animation:sh .3s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;
  cursor:pointer;padding:8px;line-height:0;color:var(--mut)}
.eye svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.eye:hover{color:var(--brand)}
button.go{width:100%;font-family:inherit;font-size:15px;font-weight:700;color:#fff;
  background:var(--brand);border:0;border-radius:9px;padding:13px;cursor:pointer;
  transition:background .15s}
button.go:hover{background:var(--brand-d)}
button.go:disabled{opacity:.6;cursor:default}
.msg{min-height:20px;font-size:12.5px;margin:12px 0 0;color:var(--err);font-weight:600}
.msg.info{color:var(--mut);font-weight:500}
.foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);
  font-size:11.5px;color:#95a0b5;line-height:1.6}
.spin{display:inline-block;width:13px;height:13px;margin-right:6px;vertical-align:-2px;
  border:2px solid rgba(60,86,200,.25);border-top-color:var(--brand);border-radius:50%;
  animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="lockicon">
    <svg viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="10.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/><circle cx="12" cy="15.7" r="1.1" fill="currentColor" stroke="none"/></svg>
  </div>
  <h1>데이터 시각화</h1>
  <p class="sub">이 학습 자료는 보호되어 있습니다.<br>수업에서 안내받은 비밀번호를 입력하세요.</p>

  <form id="f" autocomplete="off">
    <div class="field">
      <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" autofocus>
      <button type="button" class="eye" id="eye" title="비밀번호 표시" aria-label="비밀번호 표시">
        <svg viewBox="0 0 24 24"><path d="M1.6 12S5.2 5.2 12 5.2 22.4 12 22.4 12 18.8 18.8 12 18.8 1.6 12 1.6 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button type="submit" class="go" id="go">열기</button>
  </form>

  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <p class="foot">비밀번호를 모르면 내용을 볼 수 없습니다.<br>문의는 담당 교수님께 해주세요.</p>
</div>

<script>
(function(){
  "use strict";
  var P    = JSON.parse(document.getElementById('payload').textContent);
  var pw   = document.getElementById('pw'),
      go   = document.getElementById('go'),
      msg  = document.getElementById('msg'),
      f    = document.getElementById('f');

  function b2a(b64){
    var s = atob(b64), n = s.length, u = new Uint8Array(n);
    for (var i=0;i<n;i++) u[i] = s.charCodeAt(i);
    return u;
  }
  function say(t, info){ msg.textContent = t; msg.className = 'msg' + (info ? ' info' : ''); }

  if (!(window.crypto && window.crypto.subtle)) {
    say('이 브라우저/환경에서는 열 수 없습니다. 파일을 내려받아 크롬에서 직접 열거나, https 주소로 접속해 주세요.');
    go.disabled = true; pw.disabled = true;
    return;
  }

  function unlock(pass){
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function(base){
        return crypto.subtle.deriveKey(
          { name:'PBKDF2', salt:b2a(P.s), iterations:P.n, hash:'SHA-256' },
          base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      })
      .then(function(k){
        return crypto.subtle.decrypt({ name:'AES-GCM', iv:b2a(P.i) }, k, b2a(P.d));
      })
      .then(function(buf){
        var html = new TextDecoder('utf-8').decode(buf);
        document.open(); document.write(html); document.close();
      })
      .catch(function(){
        reset();
        say('비밀번호가 올바르지 않습니다.');
        document.body.classList.add('shake');
        setTimeout(function(){ document.body.classList.remove('shake'); }, 320);
        pw.value = ''; pw.focus();
      });
  }

  function busy(){
    go.disabled = true; pw.disabled = true;
    say('', true);
    msg.innerHTML = '<span class="spin"></span>여는 중…';
    msg.className = 'msg info';
  }
  function reset(){
    go.disabled = false; pw.disabled = false; say('');
  }

  f.addEventListener('submit', function(ev){
    ev.preventDefault();
    var v = pw.value;
    if (!v){ say('비밀번호를 입력하세요.'); pw.focus(); return; }
    busy();
    setTimeout(function(){ unlock(v); }, 30);
  });

  document.getElementById('eye').addEventListener('click', function(){
    pw.type = (pw.type === 'password') ? 'text' : 'password';
    pw.focus();
  });
})();
</script>
